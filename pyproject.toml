[project]
name = "rebooking-copilot"
version = "0.1.0"
description = "Reviews ticketed bookings against a fare snapshot and recommends, per booking, whether to rebook."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.1",
]

[project.scripts]
rebooking-copilot = "rebooking_copilot.cli:main"

[project.optional-dependencies]
llm = [
    "anthropic>=1.15.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "pytest>=9.1.1",
]
